<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />
    <title>Xtream Codec Studio · 二进制编解码工作台</title>
    <script>
      try {
        const theme = localStorage.getItem('xtream-codec-theme') || 'dark';
        document.documentElement.className = theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeColor =
          localStorage.getItem('xtream-codec-theme-color') || 'blue';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
