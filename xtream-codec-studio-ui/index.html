<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238052e4'/%3E%3Ctext x='16' y='22' fill='white' text-anchor='middle' font-family='monospace' font-size='18'%3E01%3C/text%3E%3C/svg%3E"
    />
    <title>Xtream Codec Studio · 二进制编解码工作台</title>
    <script>
      try {
        const theme = localStorage.getItem('xtream-codec-theme') || 'dark';
        document.documentElement.className = theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeColor =
          localStorage.getItem('xtream-codec-theme-color') || 'violet';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
